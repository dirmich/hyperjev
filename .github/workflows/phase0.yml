name: phase0

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.2"
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check src tests
      - run: uv run pytest
      - run: uv run hyperjev registry validate
      - run: uv run hyperjev benchmark --dry-run --limit 1
