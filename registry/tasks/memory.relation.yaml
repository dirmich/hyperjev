id: memory.relation
version: 1
input:
  max_chars: 12000
output:
  type: choice
  candidates: [DUPLICATE, UPDATE, EXTEND, CONTRADICT, RELATED, NONE]
thresholds:
  minimum_probability: 0.85
  otherwise: fallback
cost:
  wrong_update: 10
  wrong_contradict: 10
languages: [ko, en]
teacher_prompt_version: 1
