[project]
name = "hyperjev"
phase = 0
model_track = "encoder-typed-heads"
diffusion_track = "HyperJev-D"
default_language = "ko"

[server]
host = "127.0.0.1"
port = 6777
max_batch_size = 64
batch_wait_ms = 4

[model]
active = "phase0-mock"
runtime = "pytorch"
precision = "bf16"
max_sequence_length = 1024

[fallback]
enabled = true
primary = "qwen"
judge = "gemma"
deadline_ms = 5000

[teachers.qwen]
base_url = "http://127.0.0.1:8081/v1"
model = "qwen38fn"
roles = ["data_generator", "labeler", "fallback"]
request_timeout_s = 300
disable_thinking = true
response_format = "json_object"

[teachers.gemma]
base_url = "http://macmini:11434/v1"
model = "google/gemma-4-12b"
roles = ["cross_validator", "judge"]
request_timeout_s = 300
disable_thinking = false
response_format = "text"

[privacy]
store_raw_inputs = false
allow_training_from_user_data = false

[hypermemory]
base_url = "http://127.0.0.1:6767"
feedback_enabled = true

[paths]
registry = "registry/tasks"
phase0_smoke_set = "tests/golden/phase0_smoke.jsonl"
runs = "runs/phase0"
review_queue = "runs/phase1/review.jsonl"
feedback = "runs/phase1/feedback.jsonl"
